<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="300" viewBox="0 0 1800 300">
  <title>Regex Compilation Flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58717D"/>
    </marker>
    <marker id="triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#F8FBFC" stroke="#58717D" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #17313D; }
      .title { font-size: 22px; font-weight: 700; }
      .class-title { font-size: 15px; font-weight: 700; }
      .stereo { font-size: 11px; font-style: italic; fill: #58717D; }
      .member { font-size: 12px; }
      .label { font-size: 11px; fill: #58717D; }
      .edge { fill: none; stroke: #58717D; stroke-width: 1.5; }
      .dependency { fill: none; stroke: #58717D; stroke-width: 1.5; stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F8FBFC"/>
  <text x="30" y="36" class="title">Regex Compilation Flow</text>
